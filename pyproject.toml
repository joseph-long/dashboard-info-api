[project]
name = "dashboard-info-api"
version = "0.1.0"
description = "Info API for embedded dashboard devices (MTA subway departures, word of the day)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[project.scripts]
dashboard-info-api = "dashboard_info.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dashboard_info" = ["static/**/*"]

[tool.pytest.ini_options]
addopts = "-q --browser firefox"
asyncio_mode = "auto"
# Unit tests live inside the package; browser e2e tests live in tests_e2e
# (run explicitly: `pytest tests_e2e`).
testpaths = ["src/dashboard_info/tests"]
pythonpath = ["src"]
